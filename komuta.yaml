# ============================================================================
#  km-ai · Komuta Stack (servis adı: ai-bot)
# ============================================================================
#  AI altyapısı (sohbet kanalları, araç çağırma, MCP köprüsü): araç çağıran LLM (OpenRouter, OpenAI, Claude, Gemini, Grok,
#  Groq, DeepSeek, Mistral, yerel ...), web arama/okuma, zamanlanmış görev, hafıza,
#  köprüler. Yönetim paneli /ui (Komuta girişi + panel parolası).
#
#  Kurulum: console.komuta.io/stacks/new -> Kaynak -> 'YAML yapıştır' -> Planı
#  incele -> Yayınla. Yayın bitince konsolda 'Kurulum notları' paneli adresi gösterir. Sonra servisin Loglar sekmesinden 'Kurulum kodu'nu al ve
#  https://<servis-adresi>/ui/ adresinde panel parolasını belirle; sihirbaz
#  Telegram, sohbet, model ve aramayı sorar. Köprü/MCP/webhook varsayılan KAPALI.
#
#  Doldur: <proje-adi>, <git-baglanti-adi>, <kullanici>. Doğrula:
#      python <stack-spec>/tools/validate_stack.py . --allow-placeholders
#  Kurallar: stack-spec/docs/KOMUTA-YAML.md · Panel: docs/ARAYUZ.md
# ============================================================================
version: 1
name: ai-bot

target:
  project: <proje-adi>            # panelde ÖNCEDEN oluşturulmuş proje
  region: Germany-East
  deploymentTarget: paas
  connections:
    git: <git-baglanti-adi>       # Komuta'daki Git bağlantısının ADI
    registry: komuta

apply:
  prune: false
  createMissingProject: false     # proje yoksa plan temiz hatayla dursun
  maxParallel: 3

notes: |
  Panele servis adresinin sonuna /ui/ ekleyerek girin. İlk açılışta Komuta girişi,
  sonra servisin Loglar sekmesindeki 'Kurulum kodu' ile panel parolasını belirleyin.
  Sihirbaz Telegram, sohbet, model ve aramayı sorar.
outputs:
  - label: Panel
    value: "{{services.ai-bot.url}}ui/"

services:
  - name: ai-bot
    workload: service
    source:
      repository: https://github.com/<kullanici>/km-ai.git
      branch: main
    build:
      strategy: dockerfile
      dockerfile: Dockerfile
      context: .
    compute:
      plan: dz-dev                # 0.5 CPU / 1 GiB, aylık ~9 USD
    ports:
      - name: http
        containerPort: 8080
        primary: true
    network:
      public: true
    # İki kapı: yalnız /ui (panel) Komuta girişi ister, sonra panel parolası (ilk açılışta günlükteki
    # kurulum koduyla). Sitenin geri kalanı (/health, /bridge/, /mcp, /hook/, /channels/) girişsiz açık
    # kalır ve kendi korumalarını taşır (token, HMAC imzası, JWT); n8n, MCP istemcisi, TradingView ve
    # WhatsApp/Teams/Slack webhook'ları bu sayede kapıda kalmaz. forwardIdentity: giriş yapanın kimliği
    # uygulamaya iletilir (UI_AUTH=auto ile Komuta kimliğiyle giriş).
    access:
      signIn: false
      forwardIdentity: true
      paths:
        - path: /ui
          signIn: true
    env:
      - name: STACK_NAME
        value: ai-bot
      - name: LOG_LEVEL
        value: info
      - name: TZ
        value: Europe/Istanbul
      - name: DATA_DIR
        value: /data
      - name: PLUGINS_DIR
        value: /app/plugins
      - name: HTTP_HOST
        value: 0.0.0.0
      - name: HTTP_PORT
        value: "8080"
      # Bütün ayarlar kurulum sihirbazından (/ui) girilir; zorunlu Secret yok. İstersen
      # ortam değişkeni/Secret olarak da verebilirsin: sihirbaz onları dolu gösterir
      # (öncelik: panel > ortam > varsayılan). Örnek: examples/komuta-env-ile.yaml
      #   - name: TELEGRAM_BOT_TOKEN      (Secret)     - name: ALLOWED_CHAT_IDS (Secret)
      #   - name: LLM_PROVIDER / LLM_BASE_URL / LLM_MODEL / LLM_API_KEY (Secret)
      #   - name: UI_PASSWORD (Secret: kurulum kodu adımını atlar)
      # Komuta kimliğiyle giriş (kimlik iletme konsolda açıksa): UI_AUTH=auto veya komuta,
      # UI_ALLOWED_HOSTS=<servis-adresi>. Köprüyü açılışta açmak: BRIDGE_ENABLED=true.
      # Anahtarsız duckduckgo GÜVENİLMEZ olabilir (bulut sunucularından gelen otomatik
      # istekleri reddedebilir). Tavily/Brave/SearXNG: sihirbaz veya
      # examples/komuta-arama-saglayicili.yaml
      - name: SEARCH_PROVIDER
        value: auto
    storage:
      - name: ai-bot-data         # SQLite + panel ayar/sır dosyaları (izin 600)
        mountPath: /data
        plan: Small
    health:
      readiness:
        type: httpGet
        path: /health
        port: 8080
        initialDelaySeconds: 5
        periodSeconds: 10
      liveness:
        type: httpGet
        path: /health
        port: 8080
        initialDelaySeconds: 30
        periodSeconds: 20
    autoDeploy:
      enabled: true
