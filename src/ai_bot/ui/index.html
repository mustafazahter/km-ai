<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <link rel="preload" as="image" href="logo.svg" type="image/svg+xml">
  <title>km-ai · Yönetim</title>
  <link rel="stylesheet" href="/ui/_kit/komuta-ui.css">
  <link rel="stylesheet" href="app.css">
  <script src="/ui/_kit/komuta-ui.js"></script>
  <script src="/ui/_kit/quick-connect.js" defer></script>
  <script src="i18n-en.js" defer></script>
  <script src="app.js" defer></script>
  <script src="widgets.js" defer></script>
  <script src="help.js" defer></script>
  <script src="pages/overview.js" defer></script>
  <script src="pages/setup.js" defer></script>
  <script src="pages/settings.js" defer></script>
  <script src="pages/memory.js" defer></script>
  <script src="pages/tasks.js" defer></script>
  <script src="pages/tools.js" defer></script>
  <script src="pages/logs.js" defer></script>
  <script src="pages/telegram.js" defer></script>
  <script src="pages/chat.js" defer></script>
  <script src="pages/channels.js" defer></script>
  <script src="pages/bridge.js" defer></script>
  <script src="boot.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>
  <div class="app">
    <aside class="sidebar" aria-label="Yan menü">
      <a class="brand" href="#/">
        <span class="brand-mark is-logo"><img src="logo.svg" alt="" width="36" height="36"></span>
        <span><span class="brand-name" data-title>km-ai</span><span class="brand-sub" data-stack-version>&nbsp;</span></span>
      </a>
      <nav class="nav" aria-label="Ana menü" data-nav>
        <span class="eyebrow nav-label">Panel</span>
        <a href="#/" data-route="overview"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#home"/></svg>Genel bakış</a>
        <a href="#/sohbet" data-route="chat"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#message"/></svg>Sohbet</a>
        <a href="#/kurulum" data-route="setup"><svg class="icon" aria-hidden="true"><use href="icons.svg#spark"/></svg>Kurulum<span class="nav-count" data-setup-count hidden></span></a>
        <a href="#/ayarlar" data-route="settings"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#sliders"/></svg>Ayarlar</a>
        <span class="eyebrow nav-label">Bağlantılar</span>
        <a href="#/kanallar" data-route="channels"><svg class="icon" aria-hidden="true"><use href="icons.svg#globe"/></svg>Kanallar</a>
        <a href="#/kopru" data-route="bridge"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#plug"/></svg>Entegrasyonlar</a>
        <span class="eyebrow nav-label">Veri</span>
        <a href="#/hafiza" data-route="memory"><svg class="icon" aria-hidden="true"><use href="icons.svg#brain"/></svg>Hafıza</a>
        <a href="#/gorevler" data-route="tasks"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#clock"/></svg>Görevler</a>
        <span class="eyebrow nav-label">Sistem</span>
        <a href="#/araclar" data-route="tools"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#tool"/></svg>Araçlar</a>
        <a href="#/gunluk" data-route="logs"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#activity"/></svg>Günlük</a>
      </nav>
      <div class="sidebar-foot">
        <div class="row small muted"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#user"/></svg><span data-user>—</span></div>
        <button class="btn btn-ghost btn-sm" type="button" data-logout hidden>
          <svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#logout"/></svg>Çıkış yap
        </button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <span class="topbar-title" data-page-title>Genel bakış</span>
        <div class="topbar-actions">
          <span class="badge badge-outline hide-mobile" data-live-badge><span class="dot dot-success dot-live"></span><span data-live-text>Çalışıyor</span></span>
          <div class="lang-switch" role="group" aria-label="Dil / Language"><button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button></div>
          <button class="btn btn-ghost btn-icon" type="button" data-theme-toggle aria-pressed="false" aria-label="Tema">
            <svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#moon"/></svg>
          </button>
        </div>
      </header>

      <main class="content" id="main" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <nav class="bottombar" aria-label="Alt menü" data-nav>
    <a href="#/" data-route="overview"><svg class="icon icon-lg" aria-hidden="true"><use href="/ui/_kit/icons.svg#home"/></svg><span>Genel</span></a>
    <a href="#/sohbet" data-route="chat"><svg class="icon icon-lg" aria-hidden="true"><use href="/ui/_kit/icons.svg#message"/></svg><span>Sohbet</span></a>
    <a href="#/ayarlar" data-route="settings"><svg class="icon icon-lg" aria-hidden="true"><use href="/ui/_kit/icons.svg#sliders"/></svg><span>Ayarlar</span></a>
    <a href="#/kanallar" data-route="channels"><svg class="icon icon-lg" aria-hidden="true"><use href="icons.svg#globe"/></svg><span>Kanallar</span></a>
    <button type="button" data-more aria-haspopup="dialog" aria-expanded="false"><svg class="icon icon-lg" aria-hidden="true"><use href="icons.svg#dots"/></svg><span>Diğer</span></button>
  </nav>

  <dialog class="modal sheet" data-sheet aria-label="Diğer sayfalar">
    <div class="modal-body">
      <div class="row-between"><h2>Menü</h2><button class="btn btn-ghost btn-icon" type="button" data-sheet-close aria-label="Kapat"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#x"/></svg></button></div>
      <nav class="sheet-nav" aria-label="Tüm sayfalar" data-nav>
        <a href="#/kurulum" data-route="setup"><svg class="icon" aria-hidden="true"><use href="icons.svg#spark"/></svg>Kurulum</a>
        <a href="#/kopru" data-route="bridge"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#plug"/></svg>Köprü ve entegrasyonlar</a>
        <a href="#/hafiza" data-route="memory"><svg class="icon" aria-hidden="true"><use href="icons.svg#brain"/></svg>Hafıza</a>
        <a href="#/gorevler" data-route="tasks"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#clock"/></svg>Görevler</a>
        <a href="#/araclar" data-route="tools"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#tool"/></svg>Araçlar</a>
        <a href="#/gunluk" data-route="logs"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#activity"/></svg>Günlük</a>
      </nav>
      <div class="row-between sheet-foot">
        <span class="row small muted"><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#user"/></svg><span data-user>—</span></span>
        <button class="btn btn-ghost btn-sm" type="button" data-logout hidden><svg class="icon" aria-hidden="true"><use href="/ui/_kit/icons.svg#logout"/></svg>Çıkış</button>
      </div>
    </div>
  </dialog>
</body>
</html>
